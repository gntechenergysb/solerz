<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Solerz</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 520px;
      padding: 40px 24px;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      margin: 0 0 12px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #059669;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">HTTP 404 Error</div>
    <h1>Page Not Found</h1>
    <p>The hardware specification, comparison matrix, or engineering document you are looking for does not exist or has been relocated.</p>
    <a href="/" class="btn">Return to Solar Hardware Vault</a>
  </div>
</body>
</html>
